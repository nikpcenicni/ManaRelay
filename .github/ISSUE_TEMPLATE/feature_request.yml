name: Feature request
description: An idea for something ManaRelay could do, or do better.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. The website's Roadmap section shows what's already planned.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation at the table and what gets in the way today.
      placeholder: When we play Commander with 5 people, I keep losing track of …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. Sketches or screenshots of other apps are welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Life counter and panels
        - Commander and counters
        - Shared games across devices
        - Decks and cards
        - Events and drafts
        - Profile, stats or backup
        - Accessibility
        - Something else
  - type: dropdown
    id: app
    attributes:
      label: Which app you use
      options:
        - iPhone or iPad
        - Android
        - Both
  - type: textarea
    id: alternatives
    attributes:
      label: How you manage today
      description: A workaround, another app, pen and paper …
