name: Accessibility barrier
description: Something is hard or impossible to use with VoiceOver, TalkBack, large text, switch or keyboard control, or other settings.
title: "[Accessibility] "
labels: ["accessibility"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - iPhone or iPad
        - Android
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and device
      description: Profile → About shows the app version.
      placeholder: 1.0 (99), iPhone 13 mini, iOS 18.1
    validations:
      required: true
  - type: checkboxes
    id: settings
    attributes:
      label: What you were using
      options:
        - label: VoiceOver or TalkBack
        - label: Larger text / font size
        - label: Voice Control or Voice Access
        - label: Switch Control or Switch Access
        - label: Keyboard
        - label: Reduce Motion / Remove animations
        - label: Increase Contrast or other display settings
  - type: textarea
    id: barrier
    attributes:
      label: Where you got stuck
      description: The screen, what you tried, and what you heard or saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would work for you
